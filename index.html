<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- /local-preamble -->
<title>Mythic Pacts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Unicase:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a moonlit card table. Five realm columns face each other across a row of discard wells; the Odds panel sits beside it like an instrument. */
:root {
  color-scheme: dark;
  --night: #100e1d;
  --dusk: #19162b;
  --veil: #241f3b;
  --moon: #ede8f7;
  --mist: #a8a1c4;
  --haze: #6f6891;
  --crystal: #bfe3ff;
  --loss: #e58a9c;
  --line: rgba(237, 232, 247, .12);

  /* realm colours, matched to the card frames (used from REALM_UI in the script) */
  --fairy: #de5f8c;
  --siren: #4a6fd6;
  --dryad: #4f9d45;
  --angel: #9d64cf;
  --nymph: #22b5a0;
  --ratio: 1.75;   /* card height / width, the shape of the artwork */

  --f-display: "Cormorant Unicase", "Cormorant Garamond", Georgia, serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--moon);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--night);
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--crystal); outline-offset: 3px; }
.ico { display: inline-block; line-height: 0; }
.ico svg { width: 100%; height: 100%; display: block; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.quiet { color: var(--mist); }

/* ---------- sky ---------- */
.sky {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(70% 45% at 50% 0%, rgba(162, 116, 242, .16), transparent 70%),
    radial-gradient(60% 40% at 50% 100%, rgba(79, 134, 240, .10), transparent 70%);
}
#stars { position: absolute; inset: 0; width: 100%; height: 100%; }

.shell {
  position: relative;
  z-index: 1;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 28px;
  max-width: 1480px;
  margin-inline: auto;
}

/* ---------- header ---------- */
.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 24px;
  padding-block: 14px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .gem { width: 20px; height: 28px; color: var(--crystal); }
.brand-name {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 1.65rem;
  letter-spacing: .05em;
  line-height: 1;
}
.match-info { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; color: var(--mist); font-size: .9rem; }
.match-info .label { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
.match-info .score { color: var(--moon); }
.match-info .score b { font-family: var(--f-data); font-weight: 500; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: .88rem;
  color: var(--mist);
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.tool:hover { color: var(--moon); border-color: rgba(237, 232, 247, .32); }
.tool[aria-pressed="true"] { color: var(--night); background: var(--crystal); border-color: var(--crystal); }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 1120px) {
  .layout { grid-template-columns: minmax(0, 1fr) 350px; }
  .layout.no-odds { grid-template-columns: minmax(0, 1fr); }
  .odds { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; }
}
.table { container-type: inline-size; min-width: 0; }

.felt {
  --gap: clamp(5px, 1.5cqw, 16px);
  /* Card width: as wide as the table allows, but no taller than the window can show
     (--cw-fit is set by fitTable() in the script; it never goes below 52px). */
  --cw: min(clamp(44px, calc((100cqw - 5 * var(--gap) - 4.4cqw) / 6.15), 94px), max(52px, var(--cw-fit, 999px)));
  --ch: calc(var(--cw) * var(--ratio));
  --off: max(calc(var(--ch) * .16), 15px);
  --hw: clamp(60px, max(calc(var(--cw) * 1.14), min(86px, calc(100cqw / 8.8))), 104px);
  position: relative;
  border: 1px solid var(--line);
  border-radius: 20px;
  background:
    radial-gradient(80% 60% at 50% 50%, rgba(162, 116, 242, .07), transparent 75%),
    linear-gradient(180deg, rgba(36, 31, 59, .62), rgba(25, 22, 43, .82));
  padding: clamp(10px, 2.2cqw, 24px);
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 1.8cqw, 18px);
}
.felt.has-table-art {
  background:
    linear-gradient(rgba(16, 14, 29, .70), rgba(16, 14, 29, .82)),
    var(--table-art) center / cover;
}

/* ---------- seats ---------- */
.seat { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 34px; }
.seat-id { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.seat-name { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; letter-spacing: .04em; }
.seat-sub { color: var(--mist); font-size: .85rem; }
.turn-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--crystal);
  box-shadow: 0 0 10px var(--crystal);
  margin-right: 2px;
  transform: translateY(-2px);
}
.mini-hand { display: flex; align-items: center; }
.mini-hand .card { --w: calc(var(--cw) * .42); }
.mini-hand > * + * { margin-left: calc(var(--cw) * -.2); }
.mini-hand .known { margin-left: 6px; }
.mini-hand .known + .known { margin-left: calc(var(--cw) * -.1); }

/* ---------- board ---------- */
.board {
  display: grid;
  grid-template-columns: repeat(6, var(--cw));
  column-gap: var(--gap);
  row-gap: calc(var(--gap) + 4px);
  justify-content: center;
}
.board .divider { grid-column: 6; grid-row: 1 / 4; }
.stack, .well, .deck {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: var(--cw);
  padding: 0;
  border: 0;
  background: none;
  text-align: center;
}
button.stack, .well:not(:disabled), .deck:not(:disabled) { cursor: pointer; }
.well:disabled, .deck:disabled { cursor: default; }
.stack.opp { grid-row: 1; flex-direction: column-reverse; align-self: end; }
.stack.mine { grid-row: 3; align-self: start; }
.well { grid-row: 2; }
.deck { grid-row: 2; grid-column: 6; }

.pile {
  position: relative;
  width: var(--cw);
  height: calc(var(--ch) + (max(var(--n), 1) - 1) * var(--off));
}
.pile.empty { height: calc(var(--ch) * .55); }
.pile .slot { position: absolute; left: 0; z-index: var(--i); }
.stack.mine .slot { top: calc(var(--i) * var(--off)); }
.stack.opp .slot { bottom: calc(var(--i) * var(--off)); }
.pile > .ghost {
  position: absolute;
  inset: 0;
  border: 1.5px dashed color-mix(in oklab, var(--cc) 40%, transparent);
  border-radius: calc(var(--cw) * .09);
  display: grid;
  place-items: center;
  color: color-mix(in oklab, var(--cc) 55%, transparent);
}
.pile > .ghost .ico { width: 34%; height: auto; aspect-ratio: 1; }

.foot { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 30px; }
.stack.opp .foot { flex-direction: column-reverse; }
.tally {
  font-family: var(--f-data);
  font-variant-numeric: tabular-nums;
  font-size: clamp(11px, calc(var(--cw) * .17), 15px);
  line-height: 1;
  color: var(--moon);
  white-space: nowrap;
}
.tally.neg { color: var(--loss); }
.tally.none { color: var(--haze); }
.tally small { font-size: .8em; color: var(--mist); margin-left: 2px; }
.gems { display: flex; gap: max(1px, calc(var(--cw) * .025)); height: 8px; align-items: center; }
.gems i {
  width: max(4px, calc(var(--cw) * .055));
  height: max(4px, calc(var(--cw) * .055));
  transform: rotate(45deg);
  border: 1px solid color-mix(in oklab, var(--cc) 70%, transparent);
}
.gems i.on { background: var(--cc); border-color: var(--cc); }
.crystal {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: color-mix(in oklab, var(--cc) 62%, white 38%);
  font-family: var(--f-data);
  font-size: clamp(10px, calc(var(--cw) * .15), 13px);
  line-height: 1;
}
.crystal .ico {
  width: clamp(12px, calc(var(--cw) * .2), 20px);
  height: auto;
  aspect-ratio: 40 / 56;
  filter: drop-shadow(0 0 6px color-mix(in oklab, var(--cc) 75%, transparent));
}
.crystal-art {
  display: block;
  height: clamp(30px, calc(var(--cw) * .62), 58px);
  width: auto;
  filter: drop-shadow(0 0 8px color-mix(in oklab, var(--cc) 70%, transparent)) drop-shadow(0 0 2px rgba(255, 255, 255, .35));
}
.crystal.new .ico, .crystal.new .crystal-art { animation: crystal-in 1s cubic-bezier(.2, .9, .25, 1.25) both; }
.crystal-badge {
  position: absolute;
  z-index: 30;
  left: 50%;
  transform: translateX(-50%);
  color: color-mix(in oklab, var(--cc) 62%, white 38%);
  pointer-events: none;
}
/* The crystal hangs off the end of the line where it was earned. */
.stack.mine .crystal-badge { top: calc(100% - var(--ch) * .12); }
.stack.opp .crystal-badge { bottom: calc(100% - var(--ch) * .12); }
.crystal-badge .crystal-art {
  height: calc(var(--cw) * 1.55);
  filter: brightness(1.12) saturate(1.25) drop-shadow(0 0 3px rgba(255, 255, 255, .5)) drop-shadow(0 0 12px color-mix(in oklab, var(--cc) 80%, transparent));
}
.crystal-badge .ico { width: calc(var(--cw) * .5); }
.crystal-badge.new .crystal-art, .crystal-badge.new .ico { animation: crystal-in 1s cubic-bezier(.2, .9, .25, 1.25) both; }
.crystal-badge::before {
  content: "";
  position: absolute;
  inset: 5% -35%;
  z-index: -1;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(10, 8, 20, .92) 0 42%, color-mix(in oklab, var(--cc) 50%, transparent) 68%, transparent);
  animation: glow 3s ease-in-out infinite;
}
.crystal-bonus {
  font-family: var(--f-data);
  font-size: clamp(10px, calc(var(--cw) * .14), 12px);
  color: color-mix(in oklab, var(--cc) 55%, white 45%);
  white-space: nowrap;
}
.stack.mine .foot:has(.crystal-bonus) { padding-top: calc(var(--cw) * 1.55 - var(--ch) * .12); }
.stack.opp .foot:has(.crystal-bonus) { padding-bottom: calc(var(--cw) * 1.55 - var(--ch) * .12); }
.toast-crystal { display: inline-block; vertical-align: middle; margin-right: 10px; --cw: 70px; }
.toast-crystal .crystal-art { height: 46px; }

.well-pool, .deck-pool {
  position: relative;
  width: var(--cw);
  height: var(--ch);
  border-radius: calc(var(--cw) * .09);
  background: rgba(8, 6, 16, .45);
  box-shadow:
    inset 0 0 0 1px color-mix(in oklab, var(--cc, #8f86c9) 35%, transparent),
    inset 0 10px 24px rgba(0, 0, 0, .45);
  display: grid;
  place-items: center;
}
.well-pool > .card, .deck-pool > .card { position: absolute; inset: 0; }
.well-pool.deep > .card { box-shadow: 2px 3px 0 -1px rgba(8, 6, 16, .9), 3px 5px 0 -1px color-mix(in oklab, var(--cc) 40%, #0b0918), 0 8px 18px -8px #000; }
.well-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; color: color-mix(in oklab, var(--cc) 75%, transparent); }
.well-empty .ico { width: calc(var(--cw) * .32); height: calc(var(--cw) * .32); }
.well-portrait {
  position: absolute;
  inset: 5%;
  background: center / contain no-repeat;
  opacity: .62;
  filter: saturate(.85);
  transition: opacity .2s;
}
.well:not(:disabled):hover .well-portrait, .well.target .well-portrait { opacity: .9; }
.label {
  font-size: clamp(9px, calc(var(--cw) * .13), 12px);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--mist);
  white-space: nowrap;
  line-height: 1.2;
}
.deck-count {
  position: absolute;
  z-index: 2;
  bottom: 8%;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--f-data);
  font-size: clamp(11px, calc(var(--cw) * .17), 15px);
  background: rgba(8, 6, 16, .8);
  border: 1px solid rgba(191, 227, 255, .3);
  padding: 2px 8px;
  border-radius: 999px;
}
.seat-score { grid-column: 6; display: flex; flex-direction: column; gap: 1px; align-items: center; text-align: center; min-width: 0; }
.seat-score.opp { grid-row: 1; align-self: end; }
.seat-score.mine { grid-row: 3; align-self: start; }
.seat-score b { font-family: var(--f-data); font-weight: 500; font-size: clamp(14px, calc(var(--cw) * .24), 21px); color: var(--moon); line-height: 1.1; }
.seat-score b.neg { color: var(--loss); }
.seat-score span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.seat-score .label { letter-spacing: .02em; }

/* beckoning outline for anything you can click right now */
.target .pile::after, .can-take .well-pool::after, .can-take .deck-pool::after, .target .well-pool::after {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: calc(var(--cw) * .12);
  border: 2px solid var(--crystal);
  box-shadow: 0 0 0 4px rgba(191, 227, 255, .12), 0 0 22px rgba(191, 227, 255, .35);
  animation: beckon 1.6s ease-in-out infinite;
  pointer-events: none;
  z-index: 20;
}
.best-tag {
  position: absolute;
  z-index: 25;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--f-data);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  white-space: nowrap;
  background: var(--crystal);
  color: var(--night);
  padding: 2px 7px;
  border-radius: 999px;
  pointer-events: none;
}

/* ---------- cards ---------- */
.card {
  --w: var(--cw);
  display: block;
  position: relative;
  isolation: isolate;
  width: var(--w);
  height: calc(var(--w) * var(--ratio));
  border-radius: calc(var(--w) * .09);
  overflow: hidden;
  background: color-mix(in oklab, var(--cc) 35%, #0b0918);
  border: 1.5px solid color-mix(in oklab, var(--cc) 82%, white 8%);
  box-shadow: 0 8px 16px -9px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .1);
  text-align: left;
}
.card .art {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(130% 85% at 50% 30%,
      color-mix(in oklab, var(--cc) 82%, white 18%) 0%,
      color-mix(in oklab, var(--cc) 58%, #0b0918) 55%,
      color-mix(in oklab, var(--cc) 24%, #07060f) 100%);
  background-size: cover;
  background-position: center 20%;
}
.card .sigil { position: absolute; left: 24%; right: 24%; top: 34%; aspect-ratio: 1; color: rgba(255, 255, 255, .34); }
.card .sigil svg { width: 100%; height: 100%; display: block; }
.card::after {
  content: "";
  position: absolute;
  inset: calc(var(--w) * .045);
  border: 1px solid rgba(255, 255, 255, .24);
  border-radius: calc(var(--w) * .06);
  pointer-events: none;
}
/* Artwork has its own frame and printed number, so drop ours and keep only a corner badge. */
.card.has-art { border: 1px solid rgba(0, 0, 0, .45); }
.card.has-art .art { background-position: center; }
.card.has-art::after, .card.has-art .pact-band { display: none; }
.card.has-art .pip.tl {
  top: calc(var(--w) * .04);
  left: calc(var(--w) * .04);
  padding: calc(var(--w) * .03) calc(var(--w) * .05);
  font-size: calc(var(--w) * .21);
  border-radius: calc(var(--w) * .06);
  background: color-mix(in oklab, var(--cc) 70%, #0b0918);
  border: 1px solid rgba(232, 207, 143, .85);
  box-shadow: 0 2px 6px rgba(0, 0, 0, .45);
}
.card.has-art .pip.br { display: none; }
.stack.opp .card.has-art .pip.br {
  display: flex;
  bottom: calc(var(--w) * .04);
  right: calc(var(--w) * .04);
  padding: calc(var(--w) * .03) calc(var(--w) * .05);
  font-size: calc(var(--w) * .21);
  border-radius: calc(var(--w) * .06);
  background: color-mix(in oklab, var(--cc) 70%, #0b0918);
  border: 1px solid rgba(232, 207, 143, .85);
}
.pip {
  position: absolute;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: calc(var(--w) * .035);
  padding: calc(var(--w) * .035) calc(var(--w) * .06) calc(var(--w) * .03);
  background: rgba(9, 7, 18, .66);
  color: #fff;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: calc(var(--w) * .24);
  line-height: 1;
  font-variant-numeric: lining-nums;
}
.pip.tl { top: 0; left: 0; border-bottom-right-radius: calc(var(--w) * .08); }
.pip.br { bottom: 0; right: 0; border-top-left-radius: calc(var(--w) * .08); }
.pip b { font-weight: 700; min-width: .6em; text-align: center; }
.pip .ico { width: calc(var(--w) * .15); height: calc(var(--w) * .15); color: color-mix(in oklab, var(--cc) 55%, white 45%); }
.pip .ico.pact { width: calc(var(--w) * .2); height: calc(var(--w) * .2); color: #fff; }
.pact-band {
  position: absolute;
  left: 0; right: 0;
  bottom: 24%;
  text-align: center;
  font-family: var(--f-display);
  font-weight: 700;
  letter-spacing: .2em;
  font-size: calc(var(--w) * .13);
  padding: calc(var(--w) * .02) 0;
  background: rgba(9, 7, 18, .6);
  color: #fff;
}
.card.back {
  --cc: #8f86c9;
  background:
    repeating-linear-gradient(45deg, rgba(191, 227, 255, .06) 0 2px, transparent 2px 9px),
    radial-gradient(circle at 50% 45%, #2e2756, #141127 75%);
  border-color: rgba(191, 227, 255, .35);
}
/* The card-back art is 2:3, a little wider than the cards: show all of it and fill the gap with its own navy. */
.card.back.has-art { border-color: rgba(201, 168, 92, .5); }
.card.back.has-art .art { background-size: contain; background-repeat: no-repeat; background-color: #0a1c2f; }
.back-mark { position: absolute; left: 33%; right: 33%; top: 50%; transform: translateY(-50%); aspect-ratio: 40 / 56; color: var(--crystal); opacity: .75; }
.back-mark svg { width: 100%; height: 100%; display: block; }
.card.fresh { animation: arrive .42s cubic-bezier(.2, .8, .2, 1) both; }
.card.fresh-ai { animation: arrive .42s cubic-bezier(.2, .8, .2, 1) both, ai-glow 1.8s ease-out both; }

/* ---------- prompt ---------- */
.prompt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  flex-wrap: wrap;
  min-height: 52px;
  padding: 8px 12px;
  border-radius: 14px;
  background: rgba(8, 6, 16, .38);
  border: 1px solid var(--line);
}
.prompt-main { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.steps { display: flex; gap: 6px; }
.step {
  font-size: .7rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--haze);
  border: 1px solid var(--line);
  padding: 3px 9px;
  border-radius: 999px;
  white-space: nowrap;
}
.step.on { color: var(--night); background: var(--crystal); border-color: var(--crystal); }
.step.done { color: var(--mist); }
.prompt-text { margin: 0; text-wrap: pretty; }
.prompt-acts { display: flex; gap: 8px; }
.act {
  border-radius: 999px;
  padding: 8px 18px;
  border: 1px solid rgba(237, 232, 247, .28);
  background: transparent;
  color: var(--moon);
  cursor: pointer;
  font-weight: 500;

<script id="engine">
/* =====================================================================
   GAME ENGINE
   Pure rules and AI. No drawing code lives here, so it can be tested
   on its own. A card is a number from 0 to 59:
     realm = card / 12 (rounded down), and within a realm
     0-2 are the three Pact cards, 3-11 are the numbers 2-10.
   ===================================================================== */
const REALMS = 5;
const PER_REALM = 12;
const DECK_SIZE = 60;
const HAND = 8;
const COST = 20;           // starting a line costs 20 points
const CRYSTAL_AT = 8;      // a line of 8 or more cards earns a crystal
const CRYSTAL_BONUS = 20;

const realmOf = c => (c / PER_REALM) | 0;
const valueOf = c => { const k = c % PER_REALM; return k < 3 ? 0 : k - 1; };   // 0 means Pact
const numberCard = (realm, value) => realm * PER_REALM + value + 1;

// Small seeded random number generator (mulberry32), so simulations can be replayed.
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(a, rnd) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

const emptyRows = () => [[], [], [], [], []];

function newRound(first, rnd) {
  const deck = shuffle(Array.from({ length: DECK_SIZE }, (_, i) => i), rnd);
  const hands = [[], []];
  for (let i = 0; i < HAND; i++) { hands[0].push(deck.pop()); hands[1].push(deck.pop()); }
  return {
    hands,
    exp: [emptyRows(), emptyRows()],   // each player's five lines
    discard: emptyRows(),              // five shared discard piles
    deck,                              // top of the deck is the end of the array
    turn: first,
    phase: 'play',                     // 'play' -> 'draw' -> next player's 'play'
    lastDiscard: -1,                   // realm discarded to this turn (can't draw it back)
    known: [[], []],                   // cards each player took from a discard pile: public knowledge
    over: false,
  };
}

function topValue(pile) { return pile.length ? valueOf(pile[pile.length - 1]) : -1; }

// Lines must go up. Pacts may only be played before any numbers.
function canPlay(pile, card) {
  const t = topValue(pile);
  if (t < 0) return true;
  const v = valueOf(card);
  return v === 0 ? t === 0 : v > t;
}

function scorePile(pile) {
  let sum = 0, pacts = 0;
  for (const c of pile) { const v = valueOf(c); if (v) sum += v; else pacts++; }
  if (!pile.length) return { cards: 0, sum: 0, pacts: 0, mult: 1, base: 0, crystal: false, total: 0 };
  const mult = pacts + 1;
  const base = (sum - COST) * mult;
  const crystal = pile.length >= CRYSTAL_AT;
  return { cards: pile.length, sum, pacts, mult, base, crystal, total: base + (crystal ? CRYSTAL_BONUS : 0) };
}

function pileTotal(pile) {
  if (!pile.length) return 0;
  let sum = 0, pacts = 0;
  for (const c of pile) { const v = valueOf(c); if (v) sum += v; else pacts++; }
  return (sum - COST) * (pacts + 1) + (pile.length >= CRYSTAL_AT ? CRYSTAL_BONUS : 0);
}

function playerTotal(st, p) {
  let t = 0;
  for (const pile of st.exp[p]) t += pileTotal(pile);
  return t;
}

function removeFrom(arr, x) {
  const i = arr.indexOf(x);
  if (i >= 0) arr.splice(i, 1);
  return i >= 0;
}

function legalMoves(st) {
  const p = st.turn, hand = st.hands[p], out = [];
  for (const c of hand) {
    // Pacts of the same realm are interchangeable, so list only one of them.
    if (valueOf(c) === 0 && hand.some(d => d < c && realmOf(d) === realmOf(c) && valueOf(d) === 0)) continue;
    if (canPlay(st.exp[p][realmOf(c)], c)) out.push({ type: 'play', card: c });
    out.push({ type: 'discard', card: c });
  }
  return out;
}

function legalDraws(st) {
  const out = [-1];
  for (let r = 0; r < REALMS; r++) if (st.discard[r].length && r !== st.lastDiscard) out.push(r);
  return out;
}

function applyMove(st, move) {
  const p = st.turn, c = move.card, r = realmOf(c);
  if (st.phase !== 'play' || st.hands[p].indexOf(c) < 0) throw new Error('Illegal move');
  if (move.type === 'play' && !canPlay(st.exp[p][r], c)) throw new Error('Illegal play');
  removeFrom(st.hands[p], c);
  removeFrom(st.known[p], c);
  if (move.type === 'play') { st.exp[p][r].push(c); st.lastDiscard = -1; }
  else { st.discard[r].push(c); st.lastDiscard = r; }
  st.phase = 'draw';
}

// src = -1 for the deck, or a realm index for that discard pile. Returns the card drawn.
function applyDraw(st, src) {
  const p = st.turn;
  if (st.phase !== 'draw') throw new Error('Not time to draw');
  let card;
  if (src < 0) card = st.deck.pop();
  else {
    if (src === st.lastDiscard || !st.discard[src].length) throw new Error('Illegal draw');
    card = st.discard[src].pop();
    st.known[p].push(card);
  }
  st.hands[p].push(card);
  st.lastDiscard = -1;
  if (!st.deck.length) { st.over = true; st.phase = 'over'; }   // the round ends the moment the deck runs out
  else { st.turn ^= 1; st.phase = 'play'; }
  return card;
}

function cloneState(st) {
  return {
    hands: [st.hands[0].slice(), st.hands[1].slice()],
    exp: [st.exp[0].map(a => a.slice()), st.exp[1].map(a => a.slice())],
    discard: st.discard.map(a => a.slice()),
    deck: st.deck.slice(),
    turn: st.turn,
    phase: st.phase,
    lastDiscard: st.lastDiscard,
    known: [st.known[0].slice(), st.known[1].slice()],
    over: st.over,
  };
}

/* ---------------------------------------------------------------------
   RULES-OF-THUMB PLAYER ("Apprentice")
   Uses only what a real player can see: its own hand, the table, and
   how many cards are left. It is also the quick policy used to play
   out every simulated future in the Monte Carlo search below.
   --------------------------------------------------------------------- */

// Cards that could still turn up: not on any line and not buried in a discard pile.
function liveMap(st) {
  const live = new Uint8Array(DECK_SIZE).fill(1);
  for (const side of st.exp) for (const pile of side) for (const c of pile) live[c] = 0;
  for (const pile of st.discard) for (let i = 0; i < pile.length - 1; i++) live[pile[i]] = 0;
  return live;
}

function handMask(hand) {
  const m = new Uint8Array(DECK_SIZE);
  for (const c of hand) m[c] = 1;
  return m;
}

// Count still-live cards strictly between two values that we don't already hold.
function gapsBetween(r, lo, hi, live, mask) {
  let n = 0;
  for (let w = Math.max(lo, 1) + 1; w < hi; w++) {
    const c = numberCard(r, w);
    if (live[c] && !mask[c]) n++;
  }
  return n;
}

// Expected points from unseen cards above `above` that may still reach us.
function expectedExtra(r, above, live, mask, pGet) {
  let s = 0;
  for (let w = Math.max(above, 1) + 1; w <= 10; w++) {
    const c = numberCard(r, w);
    if (live[c] && !mask[c]) s += w;
  }
  return s * pGet * 0.55;
}

function heuristicMove(st, rnd, noise) {
  const p = st.turn, hand = st.hands[p], mine = st.exp[p], opp = st.exp[p ^ 1];
  const D = st.deck.length, T = Math.ceil(D / 2);   // turns I have left, including this one
  const pGet = T / (D + HAND);
  const live = liveMap(st), mask = handMask(hand);

  const plan = [];
  let pending = 0;
  for (let r = 0; r < REALMS; r++) {
    const pile = mine[r];
    let lowest = -1, lowNum = -1, sum = 0, n = 0, pacts = 0;
    for (let k = 0; k < PER_REALM; k++) {
      const c = r * PER_REALM + k;
      if (!mask[c] || !canPlay(pile, c)) continue;
      if (lowest < 0) lowest = c;
      const v = valueOf(c);
      if (v) { sum += v; n++; if (lowNum < 0) lowNum = c; } else pacts++;
    }
    plan.push({ pile, lowest, lowNum, sum, n, pacts, started: pile.length > 0, t: topValue(pile) });
    if (pile.length) pending += n + pacts;
  }
  const rush = pending >= T;   // more cards to place than turns left

  let best = -1, bestScore = 0;
  for (let r = 0; r < REALMS; r++) {
    const pl = plan[r];
    if (pl.lowest < 0) continue;
    const v = valueOf(pl.lowest);
    let s, card = pl.lowest;
    if (pl.started) {
      if (v === 0 && pl.sum + expectedExtra(r, 1, live, mask, pGet) >= 24) s = 3;   // another Pact on a Pact-only line
      else if (pl.lowNum >= 0) {
        card = pl.lowNum;
        s = 7 - 2.5 * gapsBetween(r, pl.t, valueOf(card), live, mask) + (rush ? 8 : 0);
      } else s = -3;
    } else if (pl.n + pl.pacts > T) {
      // Not enough turns to play every card: judge the line on the best ones there is time for.
      const vals = [];
      for (let k = 3; k < PER_REALM; k++) if (mask[r * PER_REALM + k]) vals.push(k - 1);
      const keep = vals.slice(-T);
      const proj = keep.reduce((a, b) => a + b, 0) - COST;
      if (proj > 0) { card = numberCard(r, keep[0]); s = proj / 3; } else s = -9;
    } else {
      const proj = pl.sum + expectedExtra(r, v || 1, live, mask, pGet) - COST;
      if (v === 0) s = proj >= 8 ? proj * (pl.pacts + 1) / 6 : -9;
      else s = proj / 3 - 0.3 * (v - 2);
    }
    if (noise) s += (rnd() - 0.5) * noise;
    if (s > bestScore) { bestScore = s; best = card; }
  }
  if (best >= 0) return { type: 'play', card: best };

  // Nothing worth playing: discard the card we need least and that helps the opponent least.
  let worst = hand[0], worstKeep = Infinity;
  for (const c of hand) {
    const r = realmOf(c), v = valueOf(c), pl = plan[r];
    let keep;
    if (!canPlay(pl.pile, c)) keep = -8;
    else if (pl.started) keep = 6 + v * 0.3;
    else keep = Math.max(-4, (pl.sum + expectedExtra(r, 1, live, mask, pGet) - COST) / 3) + (v ? v * 0.12 : -0.5);
    const op = opp[r];
    if (canPlay(op, c)) {
      if (op.length) keep += v ? Math.max(0, 7 - 1.5 * (v - Math.max(topValue(op), 1) - 1)) : 3;
      else keep += v * 0.15;
    }
    if (noise) keep += (rnd() - 0.5) * noise;
    if (keep < worstKeep) { worstKeep = keep; worst = c; }
  }
  return { type: 'discard', card: worst };
}

function heuristicDraw(st, rnd, noise) {
  const p = st.turn, mine = st.exp[p], opp = st.exp[p ^ 1];
  const live = liveMap(st), mask = handMask(st.hands[p]);
  let bestSrc = -1, bestVal = 1 + (noise ? (rnd() - 0.5) * noise : 0);
  for (let r = 0; r < REALMS; r++) {
    const pile = st.discard[r];
    if (!pile.length || r === st.lastDiscard) continue;
    const c = pile[pile.length - 1], v = valueOf(c), mp = mine[r];
    let val = -3;
    if (canPlay(mp, c)) {
      if (mp.length) val = v ? 5.5 - 2 * gapsBetween(r, topValue(mp), v, live, mask) : 0.5;
      else {
        let sum = v;
        for (let k = 3; k < PER_REALM; k++) if (mask[r * PER_REALM + k]) sum += k - 1;
        val = (sum - COST) / 3;
      }
    }
    const op = opp[r];
    if (op.length && v && canPlay(op, c)) val = Math.max(val, 0) + Math.max(0, 2.5 - 0.5 * (v - Math.max(topValue(op), 1) - 1));
    if (noise) val += (rnd() - 0.5) * noise;
    if (val > bestVal) { bestVal = val; bestSrc = r; }
  }
  return bestSrc;
}

/* ---------------------------------------------------------------------
   MONTE CARLO SEARCH ("Oracle" and the Odds panel)
   1. Deal the unseen cards at random into the opponent's hand and the
      deck (a "possible world"). Cards the opponent is known to hold stay put.
   2. For every legal move, play the rest of the round out in that world
      with the rules-of-thumb player on both sides.
   3. Repeat many times and average the final lead for each move.
   Every move is tested on the same worlds (common random numbers), so
   differences between moves come from the move, not from luck.
   4. Only abandon the rules-of-thumb move when another move beats it by
      more than one standard error. Picking the highest noisy average
      on its own chases luck. Over 200 test games each against the
      Apprentice, the win rate was 73% with this check and 44% without.
   --------------------------------------------------------------------- */
const ROLLOUT_NOISE = 0.5;
const ANCHOR_Z = 1;

function determinize(st, p, rnd) {
  const s = cloneState(st), o = p ^ 1;
  const seen = new Uint8Array(DECK_SIZE);
  for (const c of st.hands[p]) seen[c] = 1;
  for (const side of st.exp) for (const pile of side) for (const c of pile) seen[c] = 1;
  for (const pile of st.discard) for (const c of pile) seen[c] = 1;
  for (const c of st.known[o]) seen[c] = 1;
  const pool = [];
  for (let c = 0; c < DECK_SIZE; c++) if (!seen[c]) pool.push(c);
  shuffle(pool, rnd);
  const unknown = st.hands[o].length - st.known[o].length;
  s.hands[o] = st.known[o].concat(pool.slice(0, unknown));
  s.deck = pool.slice(unknown);
  return s;
}

function rollout(s, rnd, noise) {
  let guard = 0;
  while (!s.over && guard++ < 500) {
    if (s.phase === 'play') applyMove(s, heuristicMove(s, rnd, noise));
    else applyDraw(s, heuristicDraw(s, rnd, noise));
  }
  return s;
}

function* analyze(st, p, samples, seed) {
  const opts = st.phase === 'play'
    ? legalMoves(st)
    : legalDraws(st).map(src => ({ type: 'draw', src }));
  const k = opts.length;
  const margins = opts.map(() => new Float64Array(samples));
  const rSum = opts.map(() => new Float64Array(REALMS));
  const rPos = opts.map(() => new Float64Array(REALMS));
  const rCry = opts.map(() => new Float64Array(REALMS));
  const master = makeRng(seed);
  for (let i = 0; i < samples; i++) {
    const world = determinize(st, p, master);
    const seedI = (master() * 4294967296) >>> 0;
    for (let j = 0; j < k; j++) {
      const s = cloneState(world), o = opts[j];
      if (o.type === 'draw') applyDraw(s, o.src); else applyMove(s, o);
      rollout(s, makeRng(seedI), ROLLOUT_NOISE);
      margins[j][i] = playerTotal(s, p) - playerTotal(s, p ^ 1);
      for (let r = 0; r < REALMS; r++) {
        const pile = s.exp[p][r], sc = pileTotal(pile);
        rSum[j][r] += sc;
        if (pile.length && sc > 0) rPos[j][r]++;
        if (pile.length >= CRYSTAL_AT) rCry[j][r]++;
      }
    }
    yield (i + 1) / samples;
  }

  const meanOf = a => { let t = 0; for (const x of a) t += x; return t / a.length; };
  const seOf = (a, m) => { let t = 0; for (const x of a) t += (x - m) * (x - m); return Math.sqrt(t / a.length / a.length); };
  const options = opts.map((o, j) => {
    const mean = meanOf(margins[j]);
    const realms = [];
    for (let r = 0; r < REALMS; r++) realms.push({ mean: rSum[j][r] / samples, pPos: rPos[j][r] / samples, pCrystal: rCry[j][r] / samples });
    return Object.assign({}, o, { j, mean, se: seOf(margins[j], mean), realms });
  }).sort((a, b) => b.mean - a.mean);

  // The rules-of-thumb move is the default; the top simulated move must beat it clearly.
  const h = st.phase === 'play' ? heuristicMove(st, null, 0) : heuristicDraw(st, null, 0);
  const same = (a, b) => realmOf(a) === realmOf(b) && valueOf(a) === valueOf(b);
  const anchor = options.find(o => st.phase === 'play' ? o.type === h.type && same(o.card, h.card) : o.src === h);
  let best = options[0], edge = 0, edgeSe = 0;
  if (anchor && best !== anchor) {
    const d = margins[best.j].map((x, i) => x - margins[anchor.j][i]);
    edge = meanOf(d);
    edgeSe = seOf(d, edge);
    if (edge < ANCHOR_Z * edgeSe) best = anchor;
  }
  for (const o of options) o.recommended = o === best;
  return { options, best, anchored: best === anchor && options[0] !== anchor, edge, edgeSe, samples, rollouts: samples * k };
}
</script>

  const felt = $('#felt'), well = document.querySelector('.well');
  if (!well) return;
  felt.style.setProperty('--cw-fit', '999px');
  // Side-by-side layout: only the board has to fit. Stacked layout: board and hand together.
  const sideBySide = getComputedStyle(felt).display === 'grid';
  for (let i = 0; i < 5; i++) {
    const cw = well.offsetWidth;
    const scalable = $('#board').offsetHeight + (sideBySide ? 0 : $('#hand').offsetHeight);
    const bottom = window.scrollY + (sideBySide ? $('#board').getBoundingClientRect().bottom + 24 : $('.table').getBoundingClientRect().bottom);
    const over = bottom + 20 - window.innerHeight;
    if (over <= 1 || cw <= 52) break;
    felt.style.setProperty('--cw-fit', `${Math.max(52, Math.floor(cw * (scalable - over) / scalable))}px`);
  }
}

function rememberFocus() {
  const a = document.activeElement;
  if (!a || !a.dataset) return null;
  for (const k of ['card', 'well', 'stack', 'deck']) if (a.dataset[k] !== undefined) return [k, a.dataset[k]];
  return null;
}
function restoreFocus(key) {
  if (!key) return;
  const el = document.querySelector(`[data-${key[0]}="${key[1]}"]`);
  if (el && !el.disabled) el.focus({ preventScroll: true });
}

function renderHeader() {
  const m = ui.match;
  const roundTxt = m.rounds > 1 ? `Round ${m.round} of ${m.rounds}` : 'Single round';
  $('#matchInfo').innerHTML = `<span class="label">${roundTxt}</span>`
    + `<span class="score">${nm(0)} <b>${m.totals[0]}</b> · <b>${m.totals[1]}</b> ${nm(1)}</span>`;
  $('#btnOdds').setAttribute('aria-pressed', String(ui.showOdds));
  $('#layout').classList.toggle('no-odds', !ui.showOdds);
}

function renderSeat() {
  const st = ui.st, op = ui.viewer ^ 1, hand = st.hands[op], known = st.known[op];
  const unknown = hand.length - known.length;
  const active = !st.over && st.turn === op;
  let mini = '';
  for (let i = 0; i < unknown; i++) mini += cardBack();
  for (const c of known.slice().sort((a, b) => a - b)) mini += `<span class="known" title="${cardName(c)}: they took it from a discard pile">${cardFace(c)}</span>`;
  $('#oppSeat').innerHTML = `<div class="seat-id">`
    + `<span class="seat-name">${active ? '<span class="turn-dot"></span> ' : ''}${nm(op)}</span>`
    + `<span class="seat-sub">${hand.length} cards in hand${known.length ? ` · ${known.length} face up because they took ${known.length > 1 ? 'them' : 'it'} from a discard pile` : ''}</span>`
    + `</div><div class="mini-hand" aria-label="${nm(op)}’s hand">${mini}</div>`;
}

function stackHTML(pile, side, r, clickable) {
  const R = REALM_UI[r], s = scorePile(pile);
  let cards = '';
  pile.forEach((c, i) => { cards += `<span class="slot" style="--i:${i}">${cardFace(c, freshCls(c))}</span>`; });
  const ghost = `<span class="ghost"><i class="ico">${SIGIL[R.key]}</i></span>`;
  const tally = pile.length
    ? `<span class="tally ${s.total < 0 ? 'neg' : ''}">${signed(s.total)}${s.pacts ? `<small>×${s.mult}</small>` : ''}</span>`
    : '<span class="tally none">—</span>';
  let progress = '', badge = '';
  if (s.crystal) {
    // The crystal sits on the end of the line itself, where it was earned.
    const isNew = pile.length === CRYSTAL_AT && ui.fresh === pile[pile.length - 1];
    badge = `<span class="crystal-badge ${isNew ? 'new' : ''}" style="--i:${pile.length}" title="Crystal: 8 or more cards, +20">${crystalMark(R)}</span>`;
    progress = '<span class="crystal-bonus">crystal +20</span>';
  } else if (pile.length) {
    let g = '';
    for (let i = 0; i < CRYSTAL_AT; i++) g += `<i class="${i < pile.length ? 'on' : ''}"></i>`;
    progress = `<span class="gems" title="${pile.length} of ${CRYSTAL_AT} cards toward a crystal">${g}</span>`;
  }
  const tag = clickable ? 'button' : 'div';
  const attrs = clickable ? ` type="button" data-stack="${r}" aria-label="Play onto your ${R.one} line"` : '';
  return `<${tag} class="stack ${side} ${clickable ? 'target' : ''}" style="--cc:${R.hex};--n:${pile.length};grid-column:${r + 1}"${attrs}>`
    + `<span class="pile ${pile.length ? '' : 'empty'}">${cards || ghost}${badge}</span>`
    + `<span class="foot">${tally}${progress}</span>`
    + `</${tag}>`;
}

function analysisFresh() {
  return ui.analysis && ui.analysis.version === ui.version ? ui.analysis : null;
}

function renderBoard() {
  const st = ui.st, me = ui.viewer, op = me ^ 1;
  const human = isHumanTurn();
  const sel = ui.selected, selR = sel != null ? realmOf(sel) : -1;
  const playing = human && st.phase === 'play';
  const drawing = human && st.phase === 'draw';
  const an = analysisFresh();
  const bestDraw = drawing && an ? an.best.src : null;
  let html = '';

  for (let r = 0; r < REALMS; r++) {
    const R = REALM_UI[r];
    html += stackHTML(st.exp[op][r], 'opp', r, false);

    const pile = st.discard[r], top = pile[pile.length - 1];
    const canTake = drawing && pile.length > 0 && r !== st.lastDiscard;
    const isTarget = playing && selR === r;
    const label = isTarget ? `Discard ${cardName(sel)} here`
      : canTake ? `Take ${cardName(top)} from the ${R.one} discard pile`
      : `${R.name} discard pile, ${pile.length} card${pile.length === 1 ? '' : 's'}`;
    html += `<button type="button" class="well ${canTake ? 'can-take' : ''} ${isTarget ? 'target' : ''}" style="--cc:${R.hex};grid-column:${r + 1}" data-well="${r}" ${canTake || isTarget ? '' : 'disabled'} aria-label="${label}">`
      + `<span class="well-pool ${pile.length > 1 ? 'deep' : ''}">`
      + (pile.length ? cardFace(top, freshCls(top))
        : realmArt(R) ? `<span class="well-portrait" style="background-image:url('${realmArt(R)}')"></span>`
        : `<span class="well-empty"><i class="ico">${SIGIL[R.key]}</i></span>`)
      + (bestDraw === r ? '<span class="best-tag">Best</span>' : '')
      + `</span><span class="label">${R.name}${pile.length > 1 ? ` · ${pile.length}` : ''}</span></button>`;

    const playable = playing && selR === r && canPlay(st.exp[me][r], sel);
    html += stackHTML(st.exp[me][r], 'mine', r, playable);
  }

  const oppTotal = playerTotal(st, op), myTotal = playerTotal(st, me);
  html += `<div class="seat-score opp"><span class="label" title="${nm(op)}">${nm(op)}</span><b class="${oppTotal < 0 ? 'neg' : ''}">${signed(oppTotal)}</b><span class="label">this round</span></div>`;
  html += `<button type="button" class="deck ${drawing ? 'can-take' : ''}" data-deck="1" ${drawing ? '' : 'disabled'} aria-label="Draw from the deck, ${st.deck.length} cards left">`
    + `<span class="deck-pool">${st.deck.length ? cardBack() : ''}<span class="deck-count">${st.deck.length}</span>`
    + (bestDraw === -1 ? '<span class="best-tag">Best</span>' : '')
    + `</span><span class="label">Deck</span></button>`;
  html += `<div class="seat-score mine"><span class="label">this round</span><b class="${myTotal < 0 ? 'neg' : ''}">${signed(myTotal)}</b><span class="label" title="${nm(me)}">${nm(me)}</span></div>`;

  $('#board').innerHTML = html;
}

function renderPrompt() {
  const st = ui.st, el = $('#prompt');
  const human = isHumanTurn();
  let steps = '', text = '', acts = '';

  if (st.over) {
    text = 'The deck is empty. The round is over.';
    if (ui.match.scored === ui.match.round) acts = '<button type="button" class="act primary" data-act="results">See results</button>';
  }
  else if (ui.busy) text = `${nm(1)} is ${ui.match.skill === 'oracle' ? 'simulating possible endings' : 'thinking'}<span class="thinking"><i></i><i></i><i></i></span>`;
  else if (!ui.running) text = 'Choose how to play from the menu.';
  else if (ui.handoff) text = `Waiting for ${nm(st.turn)}.`;
  else if (human) {
    steps = `<span class="steps"><span class="step ${st.phase === 'play' ? 'on' : 'done'}">1 · Play or discard</span><span class="step ${st.phase === 'draw' ? 'on' : ''}">2 · Draw</span></span>`;
    if (st.phase === 'play') {
      if (ui.selected != null) {
        const c = ui.selected, pile = st.exp[st.turn][realmOf(c)], ok = canPlay(pile, c);
        text = ok ? `<strong>${cardName(c)}</strong>: play it on your line, or discard it.`
          : `<strong>${cardName(c)}</strong> can’t go on your ${REALM_UI[realmOf(c)].one} line (${whyNot(pile, c)}). You can discard it.`;
        acts = `<button type="button" class="act primary" data-act="play" ${ok ? '' : 'disabled'}>Play</button>`
          + '<button type="button" class="act" data-act="discard">Discard</button>';
      } else text = `${possessive(st.turn)} turn. Pick a card from your hand.`;
    } else {
      text = 'Draw a card from the deck or the top of a discard pile'
        + (st.lastDiscard >= 0 ? `, but not the ${REALM_UI[st.lastDiscard].one} card you just discarded.` : '.');
    }
  }
  el.innerHTML = `<div class="prompt-main">${steps}<p class="prompt-text">${text}</p></div><div class="prompt-acts">${acts}</div>`;
}

function whyNot(pile, c) {
  if (isPact(c)) return 'Pacts must come before any numbers';
  return `it’s at ${topValue(pile)} and must go up`;
}

function renderHand() {
  const st = ui.st, me = ui.viewer, el = $('#hand');
  if (ui.handoff || !ui.running && ui.match.mode === 'local') {
    el.innerHTML = `<div class="hand-hidden"><div class="mini-hand">${st.hands[me].map(() => cardBack()).join('')}</div><span>Hand hidden</span></div>`;
    return;
  }
  const canAct = isHumanTurn() && st.phase === 'play';
  const an = canAct ? analysisFresh() : null;
  const hand = st.hands[me].slice().sort((a, b) => a - b);
  el.innerHTML = hand.map(c => {
    const dead = !canPlay(st.exp[me][realmOf(c)], c);
    const sel = ui.selected === c;
    const best = an && an.best.card === c ? `<span class="best-tag">Best: ${an.best.type}</span>` : '';
    return `<span class="hand-slot"><button type="button" class="hand-card ${dead ? 'dead' : ''}" data-card="${c}" aria-pressed="${sel}" aria-label="${cardName(c)}${dead ? ', can only be discarded' : ''}" ${canAct ? '' : 'disabled'}>${cardFace(c, freshCls(c))}${best}</button></span>`;
  }).join('');
}

/* ---------- odds panel ---------- */
function cardStates(p) {
  const st = ui.st, s = new Array(DECK_SIZE).fill('unseen');
  for (const side of st.exp) for (const pile of side) for (const c of pile) s[c] = 'gone';
  for (const pile of st.discard) pile.forEach((c, i) => { s[c] = i === pile.length - 1 ? 'top' : 'gone'; });
  for (const c of st.known[p ^ 1]) s[c] = 'theirs';
  for (const c of st.hands[p]) s[c] = 'hand';
  return s;
}

// Chance that k specific unseen cards miss all of the m deck draws I will make,
// when unseen cards are spread evenly over S places (deck + opponent's unknown cards).
function chanceNone(S, m, k) {
  let p = 1;
  for (let i = 0; i < k; i++) { if (S - m - i <= 0) return 0; p *= (S - m - i) / (S - i); }
  return p;
}

function moveLabel(o) {
  if (o.type === 'play') return `Play ${cardName(o.card)}`;
  if (o.type === 'discard') return `Discard ${cardName(o.card)}`;
  if (o.src < 0) return 'Draw from the deck';
  const pile = ui.st.discard[o.src];
  return `Take ${cardName(pile[pile.length - 1])}`;
}

function renderOdds() {
  const el = $('#odds');
  el.hidden = !ui.showOdds;
  if (!ui.showOdds) return;
  const st = ui.st, me = ui.viewer, op = me ^ 1;
  const D = st.deck.length, T = Math.ceil(D / 2);
  const head = `<div><div class="odds-head"><h2>Odds</h2><span class="quiet">for ${nm(me)}</span></div>`
    + `<p class="odds-meta"><b>${D}</b> card${D === 1 ? '' : 's'} in the deck · ${D === 1 ? 'the next draw ends the round' : `about <b>${T}</b> more turn${T === 1 ? '' : 's'} each`}</p></div>`;

  if (ui.handoff || (!ui.running && ui.match.mode === 'local')) {
    el.innerHTML = head + '<section><p class="quiet">Hidden while the device is passed, so nobody sees the other hand.</p></section>';
    return;
  }

  // Best move
  let rec;
  const an = analysisFresh();
  if (!ui.running) rec = '<p class="quiet">Start a game to see the odds for each move.</p>';
  else if (st.over) rec = '<p class="quiet">Round over.</p>';
  else if (!isHumanTurn()) rec = `<p class="quiet">Waiting for ${nm(st.turn)}.</p>`;
  else if (!an) rec = `<p class="quiet">Simulating possible endings of the round…</p><div class="progress"><i id="progBar" style="width:${Math.round(ui.progress * 100)}%"></i></div>`;
  else {
    const best = an.best;
    const top = an.options.slice(0, 5);
    if (!top.includes(best)) top[4] = best;
    const maxAbs = Math.max(1, ...top.map(o => Math.abs(o.mean)));
    rec = `<div class="rec-top"><span class="rec-move">${moveLabel(best)}</span><span class="rec-ev ${best.mean < 0 ? 'neg' : ''}">${signed(best.mean, 1)}</span></div>`
      + `<p class="rec-note">Your average lead over ${nm(op)} when the round ends, across ${an.samples} simulated deals (standard error ±${best.se.toFixed(1)}).</p>`
      + (an.anchored ? `<p class="rec-note">Close call: ${moveLabel(an.options[0])} averaged ${an.edge.toFixed(1)} more, but that is within one standard error (±${an.edgeSe.toFixed(1)}), so the advice sticks with the rules-of-thumb move.</p>` : '')
      + '<ol class="alts">' + top.map(o => {
        const w = Math.abs(o.mean) / maxAbs * 50;
        const bar = o.mean >= 0 ? `<i style="left:50%;width:${w}%"></i>` : `<i class="neg" style="left:${50 - w}%;width:${w}%"></i>`;
        return `<li class="alt ${o.recommended ? 'is-best' : ''}" title="${moveLabel(o)}: ${signed(o.mean, 1)} ± ${o.se.toFixed(1)}"><span class="alt-name">${moveLabel(o)}</span><span class="alt-bar">${bar}</span><span class="alt-val">${signed(o.mean, 1)}</span></li>`;
      }).join('') + '</ol>';
  }

  // Realm forecast
  let fc = '<table class="fc"><thead><tr><th>Realm</th><th>Now</th><th>Forecast</th><th title="Chance the line finishes above zero">Profit</th><th title="Chance of 8+ cards">Crystal</th></tr></thead><tbody>';
  for (let r = 0; r < REALMS; r++) {
    const R = REALM_UI[r], pile = st.exp[me][r], now = pileTotal(pile);
    const f = an ? an.best.realms[r] : null;
    fc += `<tr style="--cc:${R.hex}"><td><span class="realm-tag"><i class="ico">${SIGIL[R.key]}</i>${R.name}</span></td>`
      + `<td class="${now < 0 ? 'neg' : ''}">${pile.length ? signed(now) : '—'}</td>`
      + `<td class="${f && f.mean < 0 ? 'neg' : ''}">${f ? signed(f.mean, 1) : '…'}</td>`
      + `<td>${f ? pct(f.pPos) : '…'}</td><td>${f ? pct(f.pCrystal) : '…'}</td></tr>`;
  }
  fc += '</tbody></table>';

  // Card count
  const states = cardStates(me);
  let count = '<div class="count">';
  for (let r = 0; r < REALMS; r++) {
    const R = REALM_UI[r];
    let row = `<div class="count-row" style="--cc:${R.hex}"><i class="ico" title="${R.name}">${SIGIL[R.key]}</i>`;
    let unseen = 0;
    for (let k = 0; k < PER_REALM; k++) {
      const c = r * PER_REALM + k, s = states[c];
      if (s === 'unseen') unseen++;
      row += `<span class="pipc ${s}" title="${cardName(c)}">${k < 3 ? 'P' : k - 1}</span>`;
    }
    count += row + `<span class="count-sum">${unseen} unseen</span></div>`;
  }
  count += '</div><div class="legend">'
    + '<span><span class="pipc">7</span>Unseen</span>'
    + '<span><span class="pipc hand">7</span>In your hand</span>'
    + '<span><span class="pipc top">7</span>Top of a discard pile</span>'
    + `<span><span class="pipc theirs">7</span>${nm(op)} holds it</span>`
    + '<span><span class="pipc gone">7</span>On the table</span></div>';

  // Selected card
  let insight = '<p class="quiet">Pick a card to see the chances behind it.</p>';
  if (ui.selected != null && isHumanTurn()) insight = insightHTML(ui.selected, states);

  const log = ui.log.slice(0, 8).map(e => `<li>${e.text}</li>`).join('') || '<li class="quiet">No moves yet.</li>';

  el.innerHTML = head
    + `<section><h3>Best move</h3>${rec}</section>`
    + `<section><h3>Realm forecast</h3>${fc}</section>`
    + `<section><h3>Card count</h3>${count}</section>`
    + `<section class="insight"><h3>Selected card</h3>${insight}</section>`
    + `<section><h3>Moves</h3><ol class="log">${log}</ol></section>`
    + `<section class="method"><details><summary>How these numbers work</summary>`
    + '<p><strong>Card count.</strong> Any card that isn’t in your hand, on the table, or known to be in your opponent’s hand is unseen. Each unseen card is equally likely to be in any hidden place: any position in the deck or any of your opponent’s unknown cards. So the chance it is in the deck is the deck size divided by the number of hidden places.</p>'
    + '<p><strong>Chance a card reaches you.</strong> If both players keep drawing from the deck, you draw about half of what is left. Your number of draws divided by the number of hidden places gives the chance for each card. The chance of getting at least one of several cards comes from the hypergeometric distribution.</p>'
    + `<p><strong>Best move.</strong> For every legal move, the game deals the unseen cards at random ${ADVISOR_SAMPLES} times, plays both sides to the end of the round with a rules-of-thumb strategy, and averages your final lead. Every move is tested on the same deals, so the differences come from the move rather than the luck of the draw.</p>`
    + '<p><strong>Close calls.</strong> The advice only moves away from the rules-of-thumb choice when another move wins by more than one standard error of the paired difference. Chasing the highest noisy average picks lucky moves, not good ones. Over 200 test games each against the Apprentice, the Oracle won 73% with this check and only 44% without it.</p>'
    + '<p><strong>Forecast.</strong> The same simulations, assuming you make the best move: the average final score of each line, and how often it ends in profit or earns a crystal.</p>'
    + '</details></section>';
}

function insightHTML(c, states) {
  const st = ui.st, me = ui.viewer, op = me ^ 1;
  const r = realmOf(c), v = valueOf(c), R = REALM_UI[r];
  const pile = st.exp[me][r], t = topValue(pile);
  const D = st.deck.length;
  const S = D + st.hands[op].length - st.known[op].length;
  const m = Math.ceil(D / 2);
  const pEach = S ? m / S : 0;
  const lines = [];

  if (canPlay(pile, c)) {
    const after = scorePile(pile.concat([c]));
    const skipped = [];
    if (v) for (let w = Math.max(t, 1) + 1; w < v; w++) if (states[numberCard(r, w)] === 'unseen') skipped.push(w);
    lines.push(`<p>Playing it ${pile.length ? `takes your ${R.one} line from ${t || 'Pact'} to ${v || 'another Pact'}` : `starts your ${R.one} line at a cost of 20`}. If the round ended now that line would score <span class="big">${signed(after.total)}</span>.</p>`);
    if (skipped.length) lines.push(`<p>It skips ${skipped.join(', ')}: still unseen and lost to you if you play this.</p>`);
    const blocked = st.hands[me].filter(x => x !== c && realmOf(x) === r && canPlay(pile, x) && !canPlay([c], x)).map(valueOf);
    if (blocked.length) lines.push(`<p>It also blocks the ${blocked.sort((a, b) => a - b).map(x => x || 'Pact').join(', ')} in your own hand. Play ${blocked.length > 1 ? 'those' : 'that'} first to keep ${blocked.length > 1 ? 'them' : 'it'}.</p>`);
  } else lines.push(`<p>Your ${R.one} line can’t take it any more, so it can only be discarded.</p>`);

  const floor = Math.max(v, t, 1);
  const higher = [];
  for (let w = floor + 1; w <= 10; w++) if (states[numberCard(r, w)] === 'unseen') higher.push(w);
  if (higher.length) {
    const pAny = 1 - chanceNone(S, m, higher.length);
    lines.push(`<p>Unseen ${R.name} above ${floor}: <strong>${higher.join(' · ')}</strong>. Each has a <span class="big">${pct(pEach)}</span> chance of reaching your hand. Chance of at least one: <span class="big">${pct(pAny)}</span>.</p>`);
  } else lines.push(`<p>No unseen ${R.name} above ${floor} are left.</p>`);

  const oppPile = st.exp[op][r];
  if (canPlay(oppPile, c) && oppPile.length) lines.push(`<p>If you discard it, ${nm(op)} could add it to their ${R.one} line.</p>`);
  return lines.join('');
}

function updateProgress() {
  const bar = document.getElementById('progBar');
  if (bar) bar.style.width = `${Math.round(ui.progress * 100)}%`;
}

/* ---------- simulation runner (keeps the page responsive) ---------- */
let job = null;
function runAnalysis(st, p, samples, onProgress) {
  if (job) job.cancelled = true;
  const mine = job = { cancelled: false };
  const gen = analyze(cloneState(st), p, samples, (Math.random() * 4294967296) >>> 0);
  return new Promise(resolve => {
    function step() {
      if (mine.cancelled) return resolve(null);
      const t0 = performance.now();
      let r;
      do { r = gen.next(); } while (!r.done && performance.now() - t0 < 14);
      if (r.done) { if (job === mine) job = null; resolve(r.value); }
      else { if (onProgress) onProgress(r.value); setTimeout(step, 0); }
    }
    setTimeout(step, 0);
  });
}

function requestAnalysis() {
  if (!ui.showOdds || !isHumanTurn()) return;
  const v = ui.version;
  ui.progress = 0;
  runAnalysis(ui.st, ui.st.turn, ADVISOR_SAMPLES, prog => {
    if (ui.version === v) { ui.progress = prog; updateProgress(); }
  }).then(res => {
    if (!res || ui.version !== v) return;
    ui.analysis = Object.assign(res, { version: v });
    const focusKey = rememberFocus();
    renderOdds();
    renderHand();
    renderBoard();
    restoreFocus(focusKey);
  });
}

/* ---------- game flow ---------- */
function changed() {
  ui.version++;
  save();
  render();
}

function note(p, kind, a, card) {
  let text;
  if (kind === 'play') text = `${nm(p)} played ${cardName(a)}`;
  else if (kind === 'discard') text = `${nm(p)} discarded ${cardName(a)}`;
  else if (a < 0) text = `${nm(p)} drew from the deck`;
  else text = `${nm(p)} took ${cardName(card)} from the discard`;
  ui.log.unshift({ p, text });
  if (ui.log.length > 40) ui.log.length = 40;
}

function newMatch(opts, start) {
  ui.gen++;
  if (job) job.cancelled = true;
  ui.match = {
    mode: opts.mode, skill: opts.skill, rounds: opts.rounds,
    names: opts.names, round: 1, totals: [0, 0], results: [], first: 0, scored: 0,
    started: !!start,
  };
  ui.running = !!start;
  startRound();
}

function startRound() {
  ui.gen++;
  const m = ui.match;
  ui.st = newRound(m.first, makeRng((Math.random() * 4294967296) >>> 0));
  ui.selected = null;
  ui.analysis = null;
  ui.busy = false;
  ui.log = [];
  ui.viewer = m.mode === 'ai' ? 0 : ui.st.turn;
  ui.handoff = m.mode === 'local' && ui.running;
  changed();
  if (ui.running) afterTurn(true);
}

function afterTurn(roundStart) {
  const st = ui.st, m = ui.match;
  if (st.over) { setTimeout(endRound, 900); return; }
  if (m.mode === 'ai') {
    if (st.turn === 1) aiTurn();
    else requestAnalysis();
  } else {
    ui.viewer = st.turn;
    ui.handoff = true;
    ui.selected = null;
    save();
    render();
    showHandoff(roundStart);
  }
}

function doPlay(c) {
  const st = ui.st, p = st.turn, r = realmOf(c), pile = st.exp[p][r];
  if (!canPlay(pile, c)) { toast(`${cardName(c)} can’t go there: ${whyNot(pile, c)}.`); return; }
  applyMove(st, { type: 'play', card: c });
  note(p, 'play', c);
  ui.fresh = c;
  ui.selected = null;
  if (pile.length === CRYSTAL_AT) toast(`<span class="toast-crystal" style="--cc:${REALM_UI[r].hex}">${crystalMark(REALM_UI[r])}</span>Crystal! ${possessive(p)} ${REALM_UI[r].one} line has 8 cards: +20 points.`);
  changed();
  requestAnalysis();
}

function doDiscard(c) {
  const st = ui.st, p = st.turn;
  applyMove(st, { type: 'discard', card: c });
  note(p, 'discard', c);
  ui.fresh = c;
  ui.selected = null;
  changed();
  requestAnalysis();
}

function doDraw(src) {
  const st = ui.st, p = st.turn;
  const card = applyDraw(st, src);
  note(p, 'draw', src, card);
  ui.fresh = card;
  changed();
  afterTurn(false);
}

async function aiTurn() {
  const gen = ui.gen, st = ui.st, oracle = ui.match.skill === 'oracle';
  ui.busy = true;
  renderPrompt();   // the rest was just drawn by the caller; a full render would cancel the drawn card's animation
  await wait(500);
  if (gen !== ui.gen) return;

  if (st.phase === 'play') {
    let move = oracle ? (await runAnalysis(st, 1, ORACLE_SAMPLES))?.best : null;
    if (gen !== ui.gen) return;
    if (!move) move = heuristicMove(st, Math.random, 0);
    applyMove(st, { type: move.type, card: move.card });
    note(1, move.type, move.card);
    ui.fresh = move.card;
    ui.freshAi = true;
    const pile = st.exp[1][realmOf(move.card)];
    if (move.type === 'play' && pile.length === CRYSTAL_AT) {
      const R = REALM_UI[realmOf(move.card)];
      toast(`<span class="toast-crystal" style="--cc:${R.hex}">${crystalMark(R)}</span>${nm(1)} earned a crystal on their ${R.one} line.`);
    }
    changed();
    await wait(850);
    if (gen !== ui.gen) return;
  }

  let src = oracle ? (await runAnalysis(st, 1, ORACLE_SAMPLES))?.best?.src : null;
  if (gen !== ui.gen) return;
  if (src == null) src = heuristicDraw(st, Math.random, 0);
  const card = applyDraw(st, src);
  note(1, 'draw', src, card);
  if (src >= 0) { ui.fresh = card; ui.freshAi = true; }
  ui.busy = false;
  changed();
  afterTurn(false);
}

function endRound() {
  const st = ui.st, m = ui.match;
  if (!st.over) return;
  if (m.scored !== m.round) {
    const s0 = playerTotal(st, 0), s1 = playerTotal(st, 1);
    m.totals[0] += s0;
    m.totals[1] += s1;
    m.results.push([s0, s1]);
    m.scored = m.round;
    ui.handoff = false;
    changed();
  }
  showRoundEnd();
}

function nextRound() {
  const m = ui.match;
  m.round++;
  m.first ^= 1;
  closeDialog();
  startRound();
}

/* ---------- dialogs ---------- */
let dialogOpts = null;
function openDialog(html, opts = {}) {
  const d = $('#dialog');
  d.className = 'dialog ' + (opts.wide ? 'wide' : '');
  d.innerHTML = html;
  $('#overlay').hidden = false;
  $('.shell').inert = true;   // nothing behind the dialog can be clicked or tabbed to
  dialogOpts = opts;
  d.scrollTop = 0;
  const f = d.querySelector('[autofocus]') || d.querySelector('button, input');
  if (f) f.focus({ preventScroll: true });
}
function closeDialog() {
  $('#overlay').hidden = true;
  $('.shell').inert = false;
  dialogOpts = null;
}

function realmRow() {
  if (REALM_UI.every(realmArt)) {
    return `<div class="realm-row portraits" aria-hidden="true">${REALM_UI.map(R => `<span class="portrait" style="background-image:url('${realmArt(R)}')"></span>`).join('')}</div>`;
  }
  return `<div class="realm-row" aria-hidden="true">${[10, 7, 4, 0, 9].map((v, r) => cardFace(v ? numberCard(r, v) : r * PER_REALM)).join('')}</div>`;
}

function showMenu() {
  const m = ui.match;
  const canContinue = !!ui.st && m.started !== false;
  const isDefault = s => ['You', 'Player 1', 'Player 2'].includes(s);
  const n0 = isDefault(m.names[0]) ? '' : m.names[0];
  const n1 = m.mode === 'local' && !isDefault(m.names[1]) ? m.names[1] : '';
  openDialog(`
    <div class="menu-grid">
    <div class="menu-intro">
      <p class="eyebrow">A card game of risk and reward</p>
      <h2 class="title" id="dlgTitle">Mythic Pacts</h2>
      <p class="lede">Lead the Fairies, Sirens, Dryads, Angels and Nymphs. Every line you start costs 20 points, Pacts multiply the result, and a line of 8 cards earns a crystal worth 20 more.</p>
      ${realmRow()}
    </div>
    <form class="menu-form" id="menuForm">
      <fieldset>
        <legend>Opponent</legend>
        <div class="seg">
          <label><input type="radio" name="mode" id="modeAi" value="ai" ${m.mode === 'ai' ? 'checked' : ''}><span><b>The computer</b><small>Play on your own</small></span></label>
          <label><input type="radio" name="mode" id="modeLocal" value="local" ${m.mode === 'local' ? 'checked' : ''}><span><b>A friend</b><small>Two players take turns on this screen</small></span></label>
        </div>
      </fieldset>
      <fieldset id="skillSet" ${m.mode === 'local' ? 'hidden' : ''}>
        <legend>Computer skill</legend>
        <div class="seg">
          <label><input type="radio" name="skill" id="skillApprentice" value="apprentice" ${m.skill === 'apprentice' ? 'checked' : ''}><span><b>Apprentice</b><small>Plays by rules of thumb</small></span></label>
          <label><input type="radio" name="skill" id="skillOracle" value="oracle" ${m.skill === 'oracle' ? 'checked' : ''}><span><b>Oracle</b><small>Simulates ${ORACLE_SAMPLES} possible endings before each move</small></span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Match length</legend>
        <div class="seg">
          <label><input type="radio" name="rounds" id="rounds1" value="1" ${m.rounds === 1 ? 'checked' : ''}><span><b>One round</b><small>About 10 minutes</small></span></label>
          <label><input type="radio" name="rounds" id="rounds3" value="3" ${m.rounds === 3 ? 'checked' : ''}><span><b>Three rounds</b><small>Scores add up across rounds</small></span></label>
        </div>
      </fieldset>
      <div class="names">
        <label for="name0" id="name0Label">${m.mode === 'local' ? 'Player 1' : 'Your name'}<input id="name0" maxlength="16" placeholder="${m.mode === 'local' ? 'Player 1' : 'You'}" value="${escapeHTML(n0)}"></label>
        <label for="name1" id="name1Wrap" ${m.mode === 'local' ? '' : 'hidden'}>Player 2<input id="name1" maxlength="16" placeholder="Player 2" value="${escapeHTML(n1)}"></label>
      </div>
      <div class="menu-actions">
        <button type="submit" class="act primary" autofocus>Start new game</button>
        ${canContinue ? '<button type="button" class="act" data-dlg="continue">Continue current game</button>' : ''}
        <button type="button" class="act ghost" data-dlg="rules">How to play</button>
      </div>
    </form>
    </div>`, { wide: true, dismiss: canContinue ? continueGame : null, back: showMenu });

  const form = $('#menuForm');
  form.addEventListener('change', () => {
    const local = form.mode.value === 'local';
    $('#skillSet').hidden = local;
    $('#name1Wrap').hidden = !local;
    $('#name0Label').firstChild.textContent = local ? 'Player 1' : 'Your name';
    $('#name0').placeholder = local ? 'Player 1' : 'You';
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const local = form.mode.value === 'local';
    const a = $('#name0').value.trim(), b = $('#name1').value.trim();
    const names = local
      ? [a || 'Player 1', b || 'Player 2']
      : [a || 'You', form.skill.value === 'oracle' ? 'Oracle' : 'Apprentice'];
    closeDialog();
    newMatch({ mode: form.mode.value, skill: form.skill.value, rounds: +form.rounds.value, names }, true);
  });
}

function continueGame() {
  closeDialog();
  const st = ui.st, m = ui.match;
  if (st.over) { ui.running = true; endRound(); return; }   // scores the round if needed, then shows results
  if (ui.running) {
    if (m.mode === 'local' && ui.handoff) showHandoff(false);
    return;
  }
  ui.running = true;
  ui.busy = false;
  if (m.mode === 'ai') {
    ui.viewer = 0;
    render();
    if (st.turn === 1) aiTurn(); else requestAnalysis();
  } else {
    ui.viewer = st.turn;
    ui.handoff = true;
    render();
    showHandoff(false);
  }
}

function showHandoff(roundStart) {
  const st = ui.st, p = st.turn;
  const recent = ui.log.filter(e => e.p !== p).slice(0, 2).reverse().map(e => e.text);
  const summary = !roundStart && recent.length ? `<p>${recent.join(', then ')}.</p>` : '';
  openDialog(`
    <p class="eyebrow">${ui.match.rounds > 1 ? `Round ${ui.match.round} · ` : ''}${plural(st.deck.length, 'card')} left</p>
    <h2 id="dlgTitle">Pass to ${nm(p)}</h2>
    ${summary}
    <p>${nm(p)}, your hand stays hidden until you’re ready.</p>
    <div class="dlg-actions"><button type="button" class="act primary" data-dlg="reveal" autofocus>Show ${nm(p)}’s hand</button></div>`);
}

function reveal() {
  ui.handoff = false;
  closeDialog();
  changed();
  requestAnalysis();
}

function showRules() {
  const back = dialogOpts && dialogOpts.back;
  openDialog(`
    <p class="eyebrow">How to play</p>
    <h2 id="dlgTitle">Mythic Pacts</h2>
    <p>Two players race to build profitable lines of mythical creatures. It plays like the card game Lost Cities.</p>
    <h3>The cards</h3>
    <p>60 cards in five realms: <strong>Fairies, Sirens, Dryads, Angels and Nymphs</strong>. Each realm has the numbers 2 to 10 and three <strong>Pact</strong> cards. You hold 8 cards.</p>
    <h3>Your turn has two steps</h3>
    <ol>
      <li><strong>Play or discard.</strong> Add one card to your line for its realm, or put it face up on that realm’s discard pile.</li>
      <li><strong>Draw.</strong> Take the top card of the deck, or the top card of any discard pile. You can’t take back the card you just discarded.</li>
    </ol>
    <h3>Lines only go up</h3>
    <ul>
      <li>Each card you add must be higher than the last one in that line. Gaps are allowed.</li>
      <li>Pacts must be played before any numbers in that line.</li>
      <li>The round ends the moment someone draws the last card from the deck.</li>
    </ul>
    <h3>Scoring each line you started</h3>
    <ul>
      <li>Add up the numbers and <strong>subtract 20</strong>, the cost of starting the line.</li>
      <li>Multiply by <strong>one more than the number of Pacts</strong>: 1 Pact doubles it, 2 Pacts triple it, 3 Pacts quadruple it. Losses get multiplied too.</li>
      <li><strong>Crystal:</strong> a line of 8 or more cards earns a crystal worth <strong>+20</strong>, added after multiplying.</li>
      <li>Lines you never started score nothing.</li>
    </ul>
    <div class="example" style="--cc:${REALM_UI[0].hex}">
      <span class="cards">${[0, numberCard(0, 3), numberCard(0, 5), numberCard(0, 8), numberCard(0, 9)].map(c => cardFace(c)).join('')}</span>
      <code>(3 + 5 + 8 + 9 − 20) × 2 = +10</code>
    </div>
    <h3>The Odds panel</h3>
    <p>It counts which cards you haven’t seen yet, shows the chance each one reaches you, and simulates possible endings of the round to estimate which move leaves you furthest ahead.</p>
    <div class="dlg-actions"><button type="button" class="act primary" data-dlg="${back ? 'back' : 'close'}" autofocus>${back ? 'Back' : 'Got it'}</button></div>`,
    { wide: false, dismiss: back || closeDialog, backFn: back });
}

function breakdownHTML(p) {
  const st = ui.st;
  let rows = '', total = 0;
  for (let r = 0; r < REALMS; r++) {
    const R = REALM_UI[r], s = scorePile(st.exp[p][r]);
    total += s.total;
    rows += `<tr style="--cc:${R.hex}"><td><span class="realm-tag"><i class="ico">${SIGIL[R.key]}</i>${R.name}</span></td>`;
    rows += s.cards
      ? `<td>${s.sum}</td><td>−20</td><td>${s.pacts ? '×' + s.mult : '—'}</td><td>${s.crystal ? `<span class="crystal">${crystalMark(R)}+20</span>` : `${s.cards}/8`}</td><td class="${s.total < 0 ? 'neg' : ''}">${signed(s.total)}</td></tr>`
      : '<td colspan="4" class="notyet">Not started</td><td>0</td></tr>';
  }
  return `<div><div class="who"><b>${nm(p)}</b><span class="${total < 0 ? 'neg' : ''}">${signed(total)}</span></div>`
    + `<div class="table-wrap"><table class="bd"><thead><tr><th>Realm</th><th>Sum</th><th>Cost</th><th>Pacts</th><th>Crystal</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function showRoundEnd() {
  const m = ui.match, [s0, s1] = m.results[m.results.length - 1];
  const last = m.round >= m.rounds;
  const diff = Math.abs(s0 - s1);
  const verb = p => m.names[p] === 'You' ? 'win' : 'wins';
  const roundLine = s0 === s1 ? 'The round is a tie' : `${nm(s0 > s1 ? 0 : 1)} ${verb(s0 > s1 ? 0 : 1)} the round by ${diff}`;
  let matchPart = '';
  if (m.rounds > 1) {
    matchPart = `<h3>Match</h3><div class="table-wrap"><table class="match-table"><thead><tr><th></th>${m.results.map((_, i) => `<th>Round ${i + 1}</th>`).join('')}<th>Total</th></tr></thead><tbody>`
      + [0, 1].map(p => `<tr><td>${nm(p)}</td>${m.results.map(r => `<td>${signed(r[p])}</td>`).join('')}<td>${m.totals[p]}</td></tr>`).join('')
      + '</tbody></table></div>';
  }
  let headline = roundLine;
  if (last && m.rounds > 1) {
    const [t0, t1] = m.totals;
    headline = t0 === t1 ? 'The match is a tie' : `${nm(t0 > t1 ? 0 : 1)} ${verb(t0 > t1 ? 0 : 1)} the match ${Math.max(t0, t1)} to ${Math.min(t0, t1)}`;
  }
  openDialog(`
    <p class="eyebrow">${last ? (m.rounds > 1 ? 'Final result' : 'Round over') : `Round ${m.round} of ${m.rounds} complete`}</p>
    <h2 id="dlgTitle">${headline}</h2>
    ${last && m.rounds > 1 ? `<p>${roundLine} (round ${m.round}).</p>` : ''}
    <div class="results">${breakdownHTML(0)}${breakdownHTML(1)}</div>
    ${matchPart}
    <div class="dlg-actions">
      ${last ? '<button type="button" class="act primary" data-dlg="again" autofocus>Play again</button><button type="button" class="act" data-dlg="menu">Change settings</button>'
             : `<button type="button" class="act primary" data-dlg="next" autofocus>Start round ${m.round + 1}</button>`}
      <button type="button" class="act ghost" data-dlg="close">View the table</button>
    </div>`, { wide: true, dismiss: closeDialog });
}

/* ---------- saving ---------- */
function serialize() {
  return { v: 2, match: ui.match, st: ui.st, log: ui.log, showOdds: ui.showOdds, viewer: ui.viewer, handoff: ui.handoff, running: ui.running };
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (e) { /* storage unavailable */ }
}
function loadSaved() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    return s && s.v === 2 && s.st && s.match && Array.isArray(s.st.deck) ? s : null;
  } catch (e) { return null; }
}
function restore(s) {
  ui.match = s.match;
  ui.st = s.st;
  ui.log = s.log || [];
  ui.showOdds = s.showOdds !== false;
  ui.viewer = s.viewer || 0;
  ui.handoff = !!s.handoff;
  ui.running = false;
}

/* ---------- small helpers ---------- */
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function drawStars() {
  const cv = $('#stars'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = w * dpr;
  cv.height = h * dpr;
  const g = cv.getContext('2d');
  g.scale(dpr, dpr);
  const rnd = makeRng(11);
  const n = Math.round(w * h / 8000);
  for (let i = 0; i < n; i++) {
    g.fillStyle = `rgba(237,232,247,${(0.12 + rnd() * 0.45).toFixed(2)})`;
    g.beginPath();
    g.arc(rnd() * w, rnd() * h, rnd() * 1.1 + 0.2, 0, Math.PI * 2);
    g.fill();
  }
}

/* ---------- input ---------- */
$('#hand').addEventListener('click', e => {
  const b = e.target.closest('[data-card]');
  if (!b || b.disabled) return;
  const c = +b.dataset.card;
  // A double-click plays the card straight away. (The first click re-renders the hand,
  // so a separate dblclick listener would never fire; the click's detail count still does.)
  if (e.detail === 2 && canPlay(ui.st.exp[ui.st.turn][realmOf(c)], c)) { doPlay(c); return; }
  ui.selected = ui.selected === c ? null : c;
  render();
});
$('#board').addEventListener('click', e => {
  if (!isHumanTurn()) return;
  const st = ui.st, sel = ui.selected;
  const well = e.target.closest('[data-well]'), stack = e.target.closest('[data-stack]'), deck = e.target.closest('[data-deck]');
  if (st.phase === 'play' && sel != null) {
    if (well && !well.disabled && +well.dataset.well === realmOf(sel)) doDiscard(sel);
    else if (stack && +stack.dataset.stack === realmOf(sel)) doPlay(sel);
  } else if (st.phase === 'draw') {
    if (deck && !deck.disabled) doDraw(-1);
    else if (well && !well.disabled) doDraw(+well.dataset.well);
  }
});
$('#prompt').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && b.dataset.act === 'results') { showRoundEnd(); return; }
  if (!b || b.disabled || ui.selected == null || !isHumanTurn()) return;
  if (b.dataset.act === 'play') doPlay(ui.selected); else doDiscard(ui.selected);
});
$('#dialog').addEventListener('click', e => {
  const b = e.target.closest('[data-dlg]');
  if (!b) return;
  const a = b.dataset.dlg;
  if (a === 'continue') continueGame();
  else if (a === 'rules') {
    // Keep whatever was chosen in the menu when coming back from the rules.
    const f = $('#menuForm');
    if (f) {
      const v = { mode: f.mode.value, skill: f.skill.value, rounds: f.rounds.value, n0: f.name0.value, n1: f.name1.value };
      dialogOpts.back = () => {
        showMenu();
        const g = $('#menuForm');
        g.mode.value = v.mode; g.skill.value = v.skill; g.rounds.value = v.rounds;
        g.name0.value = v.n0; g.name1.value = v.n1;
        g.dispatchEvent(new Event('change'));
      };
    }
    showRules();
  }
  else if (a === 'back') (dialogOpts && dialogOpts.backFn ? dialogOpts.backFn : closeDialog)();
  else if (a === 'close') closeDialog();
  else if (a === 'reveal') reveal();
  else if (a === 'next') nextRound();
  else if (a === 'again') { closeDialog(); newMatch(ui.match, true); }
  else if (a === 'menu') showMenu();
});
$('#btnOdds').addEventListener('click', () => {
  ui.showOdds = !ui.showOdds;
  save();
  render();
  if (ui.showOdds && !analysisFresh()) requestAnalysis();
});
$('#btnRules').addEventListener('click', () => showRules());
$('#btnMenu').addEventListener('click', () => showMenu());
document.addEventListener('keydown', e => {
  if (!$('#overlay').hidden) {
    if (e.key === 'Escape' && dialogOpts && dialogOpts.dismiss) { e.preventDefault(); dialogOpts.dismiss(); }
    return;
  }
  if (e.target.matches && e.target.matches('input')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;   // leave browser shortcuts like Cmd+P alone
  if (e.key === 'Escape' && ui.selected != null) { ui.selected = null; render(); }
  if (!isHumanTurn() || ui.st.phase !== 'play' || ui.selected == null) return;
  if (e.key === 'p' || e.key === 'P') { if (canPlay(ui.st.exp[ui.st.turn][realmOf(ui.selected)], ui.selected)) doPlay(ui.selected); }
  else if (e.key === 'd' || e.key === 'D') doDiscard(ui.selected);
});
let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { drawStars(); if (ui.st) fitTable(); }, 150);
});

/* ---------- start ---------- */
function boot(data) {
  drawStars();
  $('#brandGem').innerHTML = CRYSTAL_SVG;
  const hot = data && data.st && data.match ? data : null;
  const saved = hot || loadSaved();
  if (saved) {
    restore(saved);
    applyTableArt();
    render();
    if (hot && saved.running) continueGame(); else showMenu();
  } else {
    newMatch({ mode: 'ai', skill: 'oracle', rounds: 3, names: ['You', 'Oracle'] }, false);
    applyTableArt();
    showMenu();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => serialize());
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

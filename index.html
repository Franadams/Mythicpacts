<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- /local-preamble -->
<title>Mythic Pacts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Unicase:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="src/styles.css">

<div class="sky" aria-hidden="true"><canvas id="stars"></canvas></div>

<div class="shell">
  <header class="bar">
    <div class="brand">
      <span class="ico gem" id="brandGem"></span>
      <span class="brand-name">Mythic Pacts</span>
    </div>
    <div class="match-info" id="matchInfo"></div>
    <nav class="tools" aria-label="Game controls">
      <button class="tool" id="btnSound" type="button" aria-pressed="true" aria-label="Sound effects">Sound</button>
      <button class="tool" id="btnFull" type="button" aria-pressed="false" hidden>Full screen</button>
      <button class="tool" id="btnOdds" type="button" aria-pressed="true">Odds</button>
      <button class="tool" id="btnRules" type="button">Rules</button>
      <button class="tool" id="btnMenu" type="button">New game</button>
    </nav>
  </header>

  <main class="layout" id="layout">
    <section class="table" aria-label="Game table">
      <div class="felt" id="felt">
        <div class="seat" id="oppSeat"></div>
        <div class="board" id="board"></div>
        <div class="dock">
          <div class="prompt" id="prompt" aria-live="polite"></div>
          <div class="hand" id="hand" aria-label="Your hand"></div>
        </div>
      </div>
    </section>
    <aside class="odds" id="odds" aria-label="Odds"></aside>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/art.js"></script>
<script src="src/engine.js"></script>
<script src="src/online.js"></script>
<script src="src/sound.js"></script>
<script src="src/ui.js"></script>
